:root[data-theme=&quot;light&quot;] {

h3,

}

b,

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.card {

  padding: 12px;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

.viz-stat-value {

  line-height: 1.25;

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  background: var(--accent);

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

  align-items: center;

.btn,

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  opacity: 0.4;

.form-label {

  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  padding: 8px 10px;

.form-control:focus-visible {

  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {

  width: 100%;
  min-height: 28px;

  padding: 0 32px 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  color: var(--foreground);
  background-color: var(--secondary);

.form-check-input {

  border: 1px solid var(--input);
  color: var(--primary-foreground);

.form-range::-moz-range-track {

        { name: &#x27;Red&#x27;, color: &#x27;#ff4353&#x27;, route: [&#x27;Picking&#x27;, &#x27;Packing&#x27;, &#x27;Conveyor&#x27;] },
        { name: &#x27;Orange&#x27;, color: &#x27;#ff7a35&#x27;, route: [&#x27;Packing&#x27;, &#x27;Conveyor&#x27;, &#x27;Picking&#x27;] },
        { name: &#x27;Yellow&#x27;, color: &#x27;#ffb100&#x27;, route: [&#x27;Conveyor&#x27;, &#x27;Picking&#x27;, &#x27;Packing&#x27;] }
      ],
      B: [
        { name: &#x27;Green&#x27;, color: &#x27;#2fc47c&#x27;, route: [&#x27;Picking&#x27;, &#x27;Packing&#x27;, &#x27;Conveyor&#x27;] },
        { name: &#x27;Blue&#x27;, color: &#x27;#008aff&#x27;, route: [&#x27;Packing&#x27;, &#x27;Conveyor&#x27;, &#x27;Picking&#x27;] },
        { name: &#x27;Purple&#x27;, color: &#x27;#9f66ff&#x27;, route: [&#x27;Conveyor&#x27;, &#x27;Picking&#x27;, &#x27;Packing&#x27;] }
      ]
    };
    const blockStarts = {
      A: [610, 638, 855],
      B: [670, 698, 890]
    };
    const blockEnds = {
      A: [635, 660, 880],
      B: [695, 720, 915]
    };
    const areaColors = {
      Picking: &#x27;#008aff&#x27;,
      Packing: &#x27;#ff7a35&#x27;,
      Conveyor: &#x27;#9f66ff&#x27;
    };
    const pickingBySquad = {
      1: [
        { offset: 0, duration: 8, event: &#x27;Location Aware&#x27; },
        { offset: 10, duration: 8, event: &#x27;Waves&#x27; },
        { offset: 20, duration: 8, event: &#x27;Transition&#x27; }
      ],
      2: [
        { offset: 0, duration: 8, event: &#x27;Waves&#x27; },
        { offset: 10, duration: 8, event: &#x27;Transition&#x27; },
        { offset: 20, duration: 8, event: &#x27;Location Aware&#x27; }
      ],
      3: [
        { offset: 0, duration: 8, event: &#x27;Transition&#x27; },
        { offset: 10, duration: 8, event: &#x27;Location Aware&#x27; },
        { offset: 20, duration: 8, event: &#x27;Waves&#x27; }
      ]
    };
    let selectedWave = &#x27;A&#x27;;
    let selectedSquad = 1;
    let selectedRelay = &#x27;A&#x27;;

    const packingStationAssignments = {
      1: { A: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; }, B: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; } },
      2: { A: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; }, B: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; } },
      3: { A: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; }, B: { MIB: &#x27;TBD&#x27;, &#x27;Direct Pack&#x27;: &#x27;TBD&#x27; } }
    };

    function formatTime(totalMinutes) {
      const hour24 = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      const suffix = hour24 &gt;= 12 ? &#x27;PM&#x27; : &#x27;AM&#x27;;
      const hour = hour24 % 12 || 12;
      return `${hour}:${String(minutes).padStart(2, &#x27;0&#x27;)} ${suffix}`;
    }

    function formatRange(row) {
      return row.end === null ? formatTime(row.start) : `${formatTime(row.start)}–${formatTime(row.end)}`;
    }

    function setPressed(selector, selected) {
      root.querySelectorAll(selector).forEach(button =&gt; {
        button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.wave === selected || button.dataset.squad === selected || button.dataset.relay === selected));
      });
    }

    function populateTeams() {
      teamSelect.replaceChildren();
      teamsByWave[selectedWave].forEach((team, index) =&gt; {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = String(index);
        option.textContent = `${team.name} Team`;
        teamSelect.appendChild(option);
      });
    }

    function makeSlots(area, start, team, blockIndex) {
      if (area === &#x27;Picking&#x27;) {
        return pickingBySquad[selectedSquad].map(assignment =&gt; ({
          start: start + assignment.offset,
          end: start + assignment.offset + assignment.duration,
          area: &#x27;Picking&#x27;,
          event: assignment.event,
          transition: assignment.event === &#x27;Transition&#x27;
        }));
      }
      if (area === &#x27;Packing&#x27;) {
        const events = selectedRelay === &#x27;A&#x27; ? [&#x27;MIB&#x27;, &#x27;Direct Pack&#x27;] : [&#x27;Direct Pack&#x27;, &#x27;MIB&#x27;];
        const eventSlot = (slotStart, slotEnd, event) =&gt; ({
          start: slotStart,
          end: slotEnd,
          area: &#x27;Packing&#x27;,
          event,
          station: packingStationAssignments[selectedSquad][selectedRelay][event],
          transition: false
        });
        if (blockIndex === 1) {
          return [
            { start, end: start + 2, area: &#x27;Packing&#x27;, event: &#x27;Transition&#x27;, station: &#x27;—&#x27;, transition: true },
            eventSlot(start + 2, start + 12, events[0]),
            eventSlot(start + 14, start + 24, events[1])
          ];
        }
        return [
          eventSlot(start, start + 10, events[0]),
          { start: start + 10, end: start + 15, area: &#x27;Packing&#x27;, event: &#x27;Transition&#x27;, station: &#x27;—&#x27;, transition: true },
          eventSlot(start + 15, start + 25, events[1])
        ];
      }
      return [
        { start, end: blockEnds[selectedWave][blockIndex], area: &#x27;Conveyor&#x27;, event: &#x27;Conveyor&#x27;, transition: false, wide: true }
      ];
    }

    function blockStartFor(team, blockIndex) {
      const area = team.route[blockIndex];
      const followsPacking = blockIndex &gt; 0 &amp;&amp; team.route[blockIndex - 1] === &#x27;Packing&#x27;;
      if (area === &#x27;Conveyor&#x27; &amp;&amp; followsPacking &amp;&amp; blockIndex === 1) {
        return selectedWave === &#x27;A&#x27; ? 645 : 705;
      }
      return blockStarts[selectedWave][blockIndex];
    }

    function slotMarkup(slot) {
      const classes = [&#x27;hw2-slot&#x27;];
      if (slot.transition) classes.push(&#x27;hw2-slot-transition&#x27;);
      if (slot.wide) classes.push(&#x27;hw2-slot-wide&#x27;);
      return `
        &lt;article class=&quot;${classes.join(&#x27; &#x27;)}&quot;&gt;
          &lt;div class=&quot;hw2-slot-time&quot;&gt;${formatRange(slot)}&lt;/div&gt;
          &lt;div class=&quot;hw2-slot-fields&quot;&gt;
            &lt;div class=&quot;hw2-slot-field&quot;&gt;
              &lt;span class=&quot;hw2-field-label&quot;&gt;AREA&lt;/span&gt;
              &lt;span&gt;${slot.area}&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;hw2-slot-field&quot;&gt;
              &lt;span class=&quot;hw2-field-label&quot;&gt;EVENT&lt;/span&gt;
              &lt;span class=&quot;hw2-field-value-event&quot;&gt;${slot.event}&lt;/span&gt;
            &lt;/div&gt;
            ${slot.station !== undefined ? `
              &lt;div class=&quot;hw2-slot-field&quot;&gt;
                &lt;span class=&quot;hw2-field-label&quot;&gt;STATION&lt;/span&gt;
                &lt;span&gt;${slot.station}&lt;/span&gt;
              &lt;/div&gt;
            ` : &#x27;&#x27;}
          &lt;/div&gt;
        &lt;/article&gt;
      `;
    }

    function render() {
      const team = teamsByWave[selectedWave][Number(teamSelect.value) || 0];
      root.style.setProperty(&#x27;--hw2-team&#x27;, team.color);
      root.querySelector(&#x27;#hw2-team-name&#x27;).textContent = `${team.name.toUpperCase()} TEAM`;
      root.querySelector(&#x27;#hw2-assignment&#x27;).textContent = `Wave ${selectedWave} · Squad ${selectedSquad} · Relay ${selectedRelay}`;
      schedule.innerHTML = team.route.map((area, blockIndex) =&gt; {
        const start = blockStartFor(team, blockIndex);
        const slots = makeSlots(area, start, team, blockIndex);
        const rotation = `
          &lt;section class=&quot;hw2-rotation&quot; style=&quot;--hw2-zone:${areaColors[area]}&quot;&gt;
            &lt;div class=&quot;hw2-rotation-heading&quot;&gt;
              &lt;span class=&quot;hw2-rotation-label&quot;&gt;ROTATION ${blockIndex + 1}&lt;/span&gt;
              &lt;strong&gt;${area.toUpperCase()}&lt;/strong&gt;
            &lt;/div&gt;
            &lt;div class=&quot;hw2-event-grid&quot;&gt;
              ${slots.map(slotMarkup).join(&#x27;&#x27;)}
            &lt;/div&gt;
          &lt;/section&gt;
        `;
        if (blockIndex === 1) {
          return `${rotation}
            &lt;div class=&quot;hw2-break&quot; aria-label=&quot;Lunch and summit sessions break&quot;&gt;
              &lt;div&gt;&lt;/div&gt;
              &lt;div class=&quot;hw2-break-line&quot;&gt;&lt;span&gt;LUNCH + SESSIONS&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          `;
        }
        return rotation;
      }).join(&#x27;&#x27;);
    }

    root.querySelectorAll(&#x27;[data-wave]&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        selectedWave = button.dataset.wave;
        setPressed(&#x27;[data-wave]&#x27;, selectedWave);
        populateTeams();
        render();
      });
    });

    root.querySelectorAll(&#x27;[data-squad]&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        selectedSquad = Number(button.dataset.squad);
        setPressed(&#x27;[data-squad]&#x27;, String(selectedSquad));
        render();
      });
    });

    root.querySelectorAll(&#x27;[data-relay]&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        selectedRelay = button.dataset.relay;
        setPressed(&#x27;[data-relay]&#x27;, selectedRelay);
        render();
      });
    });

    teamSelect.addEventListener(&#x27;change&#x27;, render);
    populateTeams();
    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
